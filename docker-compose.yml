// docker-compose.yml

// rodar projeto com um único comando.

version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # Painel de controle para o avaliador ver as filas

  db-transacional:
    image: postgres:15
    environment:
      POSTGRES_DB: lancamentos

  api-lancamento:
    build: ./src/services/lancamento-service
    depends_on:
      - rabbitmq
      - db-transacional

  worker-consolidado:
    build: ./src/services/consolidado-worker
    depends_on:
      - rabbitmq